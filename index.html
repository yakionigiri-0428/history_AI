<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナル歴史アシスタント</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 20px auto; padding: 15px; background: #f4f6f8; }
    h2 { color: #2b5876; text-align: center; }
    #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 15px; margin-bottom: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .user { text-align: right; margin: 10px 0; }
    .user span { background: #d1e7dd; padding: 10px 15px; border-radius: 15px; display: inline-block; text-align: left; }
    .bot { text-align: left; margin: 10px 0; }
    .bot span { background: #eef6fc; border: 1px solid #bbeecc; padding: 12px 15px; border-radius: 15px; display: inline-block; line-height: 1.8; }
    .input-area { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0056b3; }
    ruby rt { font-size: 0.6em; color: #555; }
  </style>
</head>
<body>

  <h2>歴史学習アシスタント</h2>
  <div id="chat-box"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="例：おだのぶなが、天下布武、応仁の乱" onkeypress="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">送信</button>
  </div>

  <script>
    let historyData = [];

    // 起動時にデータを読み込む
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        historyData = data;
        addMessage("bot", "歴史データを読み込みました！ひらがなや漢字でキーワードを入力してください。");
      })
      .catch(err => {
        addMessage("bot", "エラー：data.jsonの読み込みに失敗しました。ファイル名や配置場所を確認してください。");
      });

    function addMessage(sender, text) {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="${sender}"><span>${text}</span></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const inputField = document.getElementById('userInput');
      const userText = inputField.value.trim();
      if (!userText) return;

      addMessage("user", userText);
      inputField.value = '';

      let matchedItems = [];

      for (const item of historyData) {
        let isMatch = item.keywords.some(keyword => {
          return userText.includes(keyword) || keyword.includes(userText);
        });

        if (isMatch) {
          matchedItems.push(item);
        }
      }

      setTimeout(() => {
        if (matchedItems.length > 0) {
          let replyHTML = "";
          matchedItems.forEach(item => {
            replyHTML += `<b>【${item.title}】</b><br>${item.content}<br><br>`;
          });
          addMessage("bot", replyHTML.trim());
        } else {
          addMessage("bot", "その歴史情報については、まだ学習していません。<br>（別のキーワードや、ひらがなで試してみてください）");
        }
      }, 300);
    }
  </script>
</body>
</html>
