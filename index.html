<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オリジナル歴史チャット</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
    #chat-box { border: 1px solid #ccc; height: 350px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
    .user { color: #333; text-align: right; margin: 10px 0; }
    .user span { background: #d1e7dd; padding: 8px 12px; border-radius: 15px; display: inline-block; }
    .bot { color: #333; text-align: left; margin: 10px 0; }
    .bot span { background: #fff; border: 1px solid #ccc; padding: 8px 12px; border-radius: 15px; display: inline-block; }
    input[type="text"] { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>オリジナル歴史アシスタント</h2>
  <div id="chat-box"></div>

  <input type="text" id="userInput" placeholder="歴史について質問してください（例：江戸幕府）" onkeypress="if(event.key === 'Enter') sendMessage()">
  <button onclick="sendMessage()">送信</button>

  <script>
    let historyData = [];

    // 起動時にデータを読み込む
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        historyData = data;
        addMessage("bot", "歴史データを読み込みました。何でも質問してください！");
      })
      .catch(err => {
        addMessage("bot", "エラー：データの読み込みに失敗しました。");
      });

    // メッセージを画面に追加する関数
    function addMessage(sender, text) {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="${sender}"><span>${text}</span></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 質問を送信して回答を探す関数
    function sendMessage() {
      const inputField = document.getElementById('userInput');
      const userText = inputField.value.trim();
      if (!userText) return;

      addMessage("user", userText);
      inputField.value = '';

      // 一致するキーワードが最も多いデータを探す
      let bestMatch = null;
      let maxScore = 0;

      for (const item of historyData) {
        let score = 0;
        for (const keyword of item.keywords) {
          if (userText.includes(keyword)) {
            score++;
          }
        }
        // スコアが一番高いものを記録
        if (score > 0 && score > maxScore) {
          maxScore = score;
          bestMatch = item;
        }
      }

      // 回答を表示する（見つからなかった場合のメッセージも指定）
      setTimeout(() => {
        if (bestMatch) {
          addMessage("bot", `<b>【${bestMatch.title}】</b><br>${bestMatch.content}`);
        } else {
          addMessage("bot", "その歴史情報については、まだ学習していません。");
        }
      }, 500); // 0.5秒遅らせて「考えている感」を出す
    }
  </script>
</body>
</html>
