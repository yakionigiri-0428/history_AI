<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オリジナル歴史チャット</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
    #chat-box { border: 1px solid #ccc; height: 350px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
    .user { color: #333; text-align: right; margin: 10px 0; }
    .user span { background: #d1e7dd; padding: 8px 12px; border-radius: 15px; display: inline-block; }
    .bot { color: #333; text-align: left; margin: 10px 0; }
    .bot span { background: #fff; border: 1px solid #ccc; padding: 8px 12px; border-radius: 15px; display: inline-block; line-height: 1.8; }
    input[type="text"] { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    ruby rt { font-size: 0.6em; color: #555; }
  </style>
</head>
<body>

  <h2>オリジナル歴史アシスタント</h2>
  <div id="chat-box"></div>

  <input type="text" id="userInput" placeholder="ひらがな・漢字で検索（例：あしかがよしみつ、応仁の乱）" onkeypress="if(event.key === 'Enter') sendMessage()">
  <button onclick="sendMessage()">送信</button>

  <script>
    let historyData = [];

    // 起動時にデータを読み込む
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        historyData = data;
        addMessage("bot", "歴史データを読み込みました。ひらがな・漢字どちらでも質問できます！");
      })
      .catch(err => {
        addMessage("bot", "エラー：データの読み込みに失敗しました。");
      });

    function addMessage(sender, text) {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="${sender}"><span>${text}</span></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ひらがな・漢字の表記ゆれに対応した検索処理
    function sendMessage() {
      const inputField = document.getElementById('userInput');
      const userText = inputField.value.trim();
      if (!userText) return;

      addMessage("user", userText);
      inputField.value = '';

      let matchedItems = [];

      for (const item of historyData) {
        // キーワード配列のどれかひとつでもユーザーの入力に含まれるか（またはルビタグ内の文字も含めて判定）
        let isMatch = item.keywords.some(keyword => {
          // ルビタグなどを除外して純粋なテキストを取り出して比較
          const cleanContent = item.content.replace(/<[^>]+>/g, '');
          const cleanTitle = item.title.replace(/<[^>]+>/g, '');
          
          return userText.includes(keyword) || 
                 keyword.includes(userText) || 
                 cleanContent.includes(userText) || 
                 cleanTitle.includes(userText);
        });

        if (isMatch) {
          matchedItems.push(item);
        }
      }

      setTimeout(() => {
        if (matchedItems.length > 0) {
          let replyHTML = "";
          matchedItems.forEach(item => {
            replyHTML += `<b>【${item.title}】</b><br>${item.content}<br><br>`;
          });
          addMessage("bot", replyHTML.trim());
        } else {
          addMessage("bot", "その歴史情報については、まだ学習していません。<br>（例：「あしかがよしみつ」「おうにんのらん」などひらがなでも検索できます）");
        }
      }, 400);
    }
  </script>
</body>
</html>
